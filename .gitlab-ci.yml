stages:
  - login

azure-login:
  stage: login
  image: mcr.microsoft.com/azure-cli:latest
  script:
    - echo "Logging in to Azure... with client id "
    - echo "$nameclientid"
    - echo " with clientsecret "
    - echo "$nameclientsecret"
    - echo " with tenantid "
    - echo "$nametenantid"
