stages:
  - build

  # Tests the app, shows the tests logs and info in the test section of the pipeline
  - test

  # Creates resource group, virtual machine and SQL DataBase for deployment using terraform (OpenTofu) if they don't already exist
  - pre-deploy

  # Uses ansible to log into deployment virtual machine, setup project dependendencies and runs the project using docker compose
  - deploy

  # If you run it (manually) it destroy the resources for the deployment (deployment virtual machine, rg, sql database, etc.)
  - destroy-deployment

  # If you run it (manually) it destroys the custom azure gitlab-runner resources (rg and vm), to run the pipeline you would have to execute manually the (ROOT_PROJ_DIR)/azure-config/gitlab-runner-setup/azure-setup.sh script to create and set up the runner
  - destroy-runner

  # When ran (manually), it destroys all azure resources, (including runner and deployment)
  - destroy-all

