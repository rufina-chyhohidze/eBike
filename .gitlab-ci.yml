stages:
  - build
  - test
  - pre-deploy # Creates resource group, virtual machine and SQL DataBase for deployment using terraform (OpenTofu) if they don't exist
  - deploy
# - destroy

# for destory stage: tofu apply -destroy --auto-approve

build_application:
  stage: build
  tags:
    - azure
    - shell
  script:
    # Make the script executable
    - chmod +x ./azure-config/stages/build.sh
    # Run it
    - ./azure-config/stages/build.sh
