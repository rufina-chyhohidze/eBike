stages:
  - login

azure-login:
  stage: login
  image: mcr.microsoft.com/azure-cli:latest  # Use the official Azure CLI image
  script:
    - echo "Logging in to Azure..."
    - az login --service-principal \
      --username "$CLIENT_ID" \
      --password "$CLIENT_SECRET" \
      --tenant "$TENANT_ID"
    - az account show && echo "✅ Azure login successful" || echo "❌ Error logging in"
