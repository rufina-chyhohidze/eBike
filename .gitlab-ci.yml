image: gradle:8.5-jdk21

stages:
  - build
  - test

build:
  stage: build
  script:
    - gradle clean build -x test
  artifacts:
    paths:
      - build/libs/*.jar

test:
  stage: test
  services:
    - name: postgres:17.2-alpine
      alias: db
  variables:
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ebike_test
    SPRING_DATASOURCE_USERNAME: dev
    SPRING_DATASOURCE_PASSWORD: bike
    SPRING_PROFILES_ACTIVE: test
  script:
    - gradle test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml


