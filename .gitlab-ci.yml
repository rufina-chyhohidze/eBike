stages:
  - setup-vm
  - login

# Use Docker-in-Docker for building images
build-image:
  stage: setup-vm
  image: docker:latest  # Use a Docker image that supports Docker-in-Docker
  services:
    - docker:19.03.12-dind  # Use Docker-in-Docker service
  script:
    - docker info  # Check if Docker is running
    - docker build -t custom-azure-cli-image .

azure-login:
  stage: login
  image: custom-azure-cli-image  # Use the custom image built above
  script:
    - az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID" &>/dev/null
    - az account show &>/dev/null && echo "✅ Azure login successful" || echo "❌ Error logging in"
    - az group create --name rg-team18-integration4 --location westeurope
    - chmod +x ./azure-config/create-virtual-machine.sh  # Make sure the script is executable
    - ./azure-config/create-virtual-machine.sh  # Execute the script


