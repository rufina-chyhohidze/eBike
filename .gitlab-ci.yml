azure-pre-deployment-setup:
  stage: pre-deploy
  image: anir333/team18-int4:latest
  tags:
    - azure
    - docker
  script:
    - echo "========== PRE-DEPLOY STAGE =========="
    - cd ./azure-config/deployment/ || exit 1
    - chmod +x ./pre-deploy-check.sh
    - ./pre-deploy-check.sh
    - echo "========== PRE-DEPLOY STAGE COMPLETED SUCCESSFULLY =========="


deploy_application:
  stage: deploy
  image: anir333/team18-int4:latest
  tags:
    - azure
    - docker
  script:
    - cd azure-config/deployment/
    - chmod +x azure-login.sh
    - ./azure-login.sh
    - cd ansible/
    - chmod +x setup-ansible-inventory.sh
    - ./setup-ansible-inventory.sh
    - ansible-playbook -i inventory.ini playbook.yml





