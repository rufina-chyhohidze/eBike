variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DB_USER: dev
  DB_PASSWORD: bike
  DB_NAME: ebike_test

build_application:
  stage: build
  tags:
    - azure
    - setup
  script:
    - echo "========== BUILD STAGE =========="
    - gradle clean build -x test
    - echo "Build completed successfully."
    - echo "Running pipeline now! $(date)" >> /root/pipeline/cd.log
  artifacts:
    paths:
      - build/libs/*.jar

