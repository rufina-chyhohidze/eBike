test_application:
  stage: test
  tags:
    - azure
    - shell
  script:
    - echo "========== TEST STAGE =========="
    - cat src/test/resources/application-test.properties
    - docker compose run --user "$(id -u):$(id -g)" --remove-orphans team18-integration-test
    - echo "========== TEST STAGE COMPLETED SUCCESSFULLY =========="
