<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../static/js/report-settings.js" th:src="@{/js/report-settings.js}" type="module"></script>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>
<body class="bg-gray-50 h-full flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-gray-900 text-white shadow-md p-6 flex flex-col min-h-screen space-y-8">
    <div class="flex items-center mb-6">
        <i class="ph ph-bicycle text-purple-500 text-3xl mr-2"></i>
        <h1 class="text-2xl font-semibold">eVALeBike</h1>
    </div>

    <ul class="space-y-6 flex-1">
        <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
            <i class="ph ph-wrench"></i> Dashboard
        </li>
        <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
            <i class="ph ph-house"></i> Home
        </li>
        <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
            <i class="ph ph-play-circle"></i><a href="/technician/start-test"> Start Test </a>
        </li>
        <li class="flex items-center gap-3 text-purple-500 hover:text-white cursor-pointer">
            <i class="ph ph-clipboard-text"></i> Report Settings
        </li>
        <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
            <i class="ph ph-user"></i> Account Settings
        </li>
        <li class="mt-auto">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-lg w-full hover:bg-purple-700 flex items-center justify-center gap-2">
                    <i class="ph ph-sign-out"></i> Logout
                </button>
            </form>
        </li>
    </ul>
</aside>

<!-- MAIN CONTENT -->
<main class="flex-1 p-6 grid grid-cols-4 gap-6 bg-white">
    <!-- REPORT SETTINGS -->
    <div class="bg-white shadow-lg rounded-3xl p-6 col-span-4 border border-gray-200">
        <h3 class="text-xl font-semibold mb-4 text-gray-800">Report Settings</h3>

        <!-- Form to Update Horizontal and Vertical Vibration Range -->
            <div class="space-y-6">
                <!-- Horizontal Vibration Range -->
                <div class="flex items-center justify-between">
                    <label for="horizontalVibration" class="text-gray-700">Horizontal Vibration Range (Hz)</label>
                    <input type="number" id="horizontalVibration" name="horizontalVibration" class="p-2 border border-gray-300 rounded-lg w-2/3" placeholder="Enter horizontal vibration range" required>
                </div>

                <!-- Vertical Vibration Range -->
                <div class="flex items-center justify-between">
                    <label for="verticalVibration" class="text-gray-700">Vertical Vibration Range (Hz)</label>
                    <input type="number" id="verticalVibration" name="verticalVibration" class="p-2 border border-gray-300 rounded-lg w-2/3" placeholder="Enter vertical vibration range" required>
                </div>

                <!-- Submit Button -->
                <div class="mt-4">
                    <button id="submit" class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 w-full">
                        Update Settings
                    </button>
                </div>
            </div>
    </div>

</main>

</body>
</html>
