<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" content="width=device-width, initial-scale=1">
    <title>Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link rel="stylesheet" th:href="@{/css/control.css}" href="/static/css/control.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script th:src="@{/js/qr-code-generation.js}" type="module"></script>
</head>
<body>

<section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-md-8 col-lg-8 col-xl-9">
                <div class="card text-black" style="border-radius: 25px;">
                    <div class="card-body p-5 text-center">
                        <input type="hidden" id="testId" th:value="${id}"/>
                        <h1 class="fw-bold mb-4">Test Result Successfully Saved</h1>
                        <div id="qrcode" class="h-[100px] w-[100px]"></div>
                        <div class="d-flex justify-content-center">
                            <a href="/test-history" class="btn btn-primary me-3">Test History</a>
                            <a href="/start-test" class="btn btn-success">Start a New Test</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
