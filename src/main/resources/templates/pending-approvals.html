<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8" content="width=device-width, initial-scale=1">
    <title>Pending approvals</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="bg-gray-900 text-white shadow-lg rounded-3xl p-6">
    <h3 class="text-xl font-semibold mb-2 text-gray-200">Approve Employees</h3>
    <p class="text-gray-300 text-sm mb-4">Approve technicians and admins who have registered.</p>

    <div class="space-y-2">
        <div th:each="user : ${pendingUsers}" class="bg-gray-800 p-3 rounded-lg flex justify-between items-center">
            <div>
                <span class="text-white text-sm" th:text="${#strings.capitalize(user.class.simpleName)} + ': ' + ${user.name}"></span><br>
                <span class="text-gray-400 text-xs" th:text="'Email: ' + ${user.email}"></span>
            </div>
            <div class="flex gap-2">
                <form th:action="@{/superadmin/approve/{id}(id=${user.id})}" method="post">
                    <button class="bg-purple-600 text-white px-3 py-1 rounded-lg hover:bg-purple-700 text-sm">Approve</button>
                </form>
                <form th:action="@{/superadmin/reject/{id}(id=${user.id})}" method="post">
                    <button class="bg-red-600 text-white px-3 py-1 rounded-lg hover:bg-red-700 text-sm">Reject</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
