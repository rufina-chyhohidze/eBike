<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script th:src="@{/js/userFilterWorkshop.js}" type="module"></script>
  <script th:src="@{/js/reportFilter.js}" type="module"></script>
  <script th:src="@{/js/passwordUpdate.js}" type="module"></script>

  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-gray-50 h-full flex">

<div th:replace="fragments/admin-navbar :: adminnavbar"></div>
<!-- MAIN CONTENT -->
<main class="flex-1 p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 bg-white overflow-x-auto">

  <!-- Technician Info -->
  <div class="bg-white shadow-lg rounded-3xl p-6 flex flex-col sm:flex-row items-center gap-6 col-span-full border border-gray-200">
    <img src="https://static.vecteezy.com/system/resources/previews/007/469/004/non_2x/graduated-student-in-simple-flat-personal-profile-icon-or-symbol-people-concept-illustration-vector.jpg" alt="Technician" class="w-24 h-24 rounded-full border-2 border-gray-300">
    <div class="text-center sm:text-left">
      <h2 class="text-2xl font-semibold text-gray-800" th:text="${admin.name}"></h2>
      <p class="text-gray-600">Workshop administrator</p>
      <p class="text-gray-500"><span class="font-semibold" th:text="${admin.workshop.workshopName}"></span></p>
<!--      <a href="/workshopadmin/dashboard/update" class="mt-3 inline-block bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600">Update Account Info</a>-->
      <button onclick="toggleModal()" class="mt-2 bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600">
        Update Account Info
      </button>
    </div>
  </div>

  <!-- Stats Cards Container -->
  <div class="col-span-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <div class="bg-gray-900 text-white shadow-lg rounded-3xl p-6 text-center border border-gray-200">
      <h3 class="text-xl font-semibold mb-2 text-gray-200">Total Tests</h3>
      <p class="text-3xl font-bold text-purple-500" th:text="${totalReports}"></p>
    </div>

    <div class="bg-gray-900 text-white shadow-lg rounded-3xl p-6 text-center border border-gray-200">
      <h3 class="text-xl font-semibold mb-2 text-gray-200">Total Clients</h3>
      <p class="text-3xl font-bold text-purple-500" th:text="${totalClients}"></p>
    </div>
  </div>

  <!-- Customer Table -->
  <div class="bg-white shadow-lg rounded-3xl p-6 col-span-4 border border-gray-200 overflow-x-auto">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
        <i class="ph ph-user-check"></i> Customer List
      </h3>
    </div>

    <form class="mb-4">
      <input class="p-2 border border-gray-300 rounded-lg w-full" id="user-filter" type="text" name="filter" placeholder="Enter User Name" th:value="${filter}" />
    </form>

    <div class="overflow-x-auto">
      <table class="min-w-max w-full border-collapse bg-white shadow-md rounded-3xl">
        <thead>
        <tr class="bg-gray-100 text-gray-700">
          <th class="p-3 text-left">User ID</th>
          <th class="p-3 text-left">Name</th>
          <th class="p-3 text-left hidden sm:table-cell">Email</th>
        </tr>
        </thead>
        <tbody id="user-table-content">
        <tr th:if="${#lists.isEmpty(customers)}">
          <td colspan="3" class="text-center text-gray-500 py-4">No users found matching your search.</td>
        </tr>
        <tr th:each="customer : ${customers}" class="bg-white border-b">
          <td th:text="${customer.id}" class="p-3"></td>
          <td th:text="${customer.name}" class="p-3"></td>
          <td th:text="${customer.email}" class="p-3 hidden sm:table-cell"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Reports Table -->
  <div class="bg-gray-900 text-white shadow-lg rounded-3xl p-6 col-span-4 border border-gray-200 overflow-x-auto">
    <h3 class="text-xl font-semibold mb-4 flex justify-center items-center gap-2 text-center text-gray-200">
      <i class="ph ph-clipboard-text"></i> Previous Test Reports
    </h3>

    <div class="flex justify-center">
      <form class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 w-full max-w-2xl">
        <input class="p-2 border border-gray-300 rounded-lg w-full text-black" name="frameNumber" type="text" placeholder="Frame Number" th:value="${frameNumber}" />
        <input class="p-2 border border-gray-300 rounded-lg w-full text-black" name="engineType" type="text" placeholder="Engine Type" th:value="${engineType}" />
        <div class="sm:col-span-2 flex justify-center">
          <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700">Search</button>
        </div>
      </form>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-max w-full border-collapse bg-gray-800 shadow-md rounded-3xl">
        <thead>
        <tr class="bg-gray-700 text-gray-100">
          <th class="p-3 text-left">Report ID</th>
          <th class="p-3 text-left">Report Date</th>
          <th class="p-3 text-left">Customer ID</th>
          <th class="p-3 text-left">Frame Number</th>
          <th class="p-3 text-left">Engine Type</th>
          <th class="p-3 text-left">Bench ID</th>
          <th class="p-3 text-left"></th>
        </tr>
        </thead>
        <tbody id="reports-table-content">
        <tr th:each="report : ${bikeReports}" class="border-b">
          <td th:text="${report.id}" class="p-3"></td>
          <td th:text="${report.reportDate}" class="p-3"></td>
          <td th:text="${report.customer.id}" class="p-3"></td>
          <td th:text="${report.bike.frameNumber}" class="p-3"></td>
          <td th:text="${report.bike.bikeModel.engineType}" class="p-3"></td>
          <td th:text="${report.testBench.benchId}" class="p-3"></td>
          <td class="p-3">
            <a class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 w-full block text-center" th:href="@{/report/{id}(id=${report.id})}">Report</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- MODAL BACKDROP -->
<div id="profileModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
  <!-- MODAL CONTENT -->
  <div class="bg-white rounded-2xl shadow-xl p-4 sm:p-8 w-full max-w-lg relative mx-4">
    <button onclick="toggleModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
      <i class="ph ph-x text-2xl"></i>
    </button>
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex items-center gap-2">
      <i class="ph ph-user-gear text-purple-600 text-2xl"></i> Edit Profile
    </h2>

    <!-- PASSWORD UPDATE FORM -->
    <form id="passwordForm" class="space-y-6">
      <input type="hidden" id="id" name="id" th:value="${admin.id}" />
      <div>
        <label class="block text-gray-700 font-medium mb-2">New Password</label>
        <input type="password" id="newPassword" name="newPassword"
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-2">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword"
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none" />
      </div>

      <div id="passwordMessage" class="text-sm mt-2"></div>
      <button type="submit" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition w-full">
        Update Password
      </button>
    </form>
  </div>
</div>

<script>
  function toggleModal() {
    const modal = document.getElementById('profileModal');
    modal.classList.toggle('hidden');
  }
</script>

</body>
</html>
