<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="../static/js/customer.js" th:src="@{/js/customer.js}" type="module"></script>
  <script th:src="@{/js/techNavbar.js}" type="module"></script>

</head>
<body class="bg-gray-50 h-full flex">

<div th:replace="fragments/superadmin-navbar :: superadmin-navbar"></div>


<!-- REPORTS -->
<main class="flex-1 p-6 bg-white">
  <div class="mb-6">
    <h1 class="text-3xl font-semibold text-gray-800"><span th:text="${customer.name}"></span>'s Bike Reports</h1>
    <p class="text-gray-600">View and search through all customer's bike test reports</p>
  </div>

  <!-- SEARCH FILTERS -->
  <!-- TEST REPORTS -->
  <div class="bg-gray-900 text-white shadow-lg rounded-3xl p-6 col-span-4 border border-gray-200 overflow-x-auto">
    <h3 class="text-xl font-semibold mb-4 flex justify-center items-center gap-2 text-center text-gray-200">
      <i class="ph ph-clipboard-text"></i> Previous Test Reports
    </h3>

    <div class="flex justify-center">
      <form class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 w-full max-w-2xl">
        <input class="p-2 border border-gray-300 rounded-lg w-full text-black" name="frameNumber" type="text" placeholder="Frame Number" th:value="${frameNumber}" />
        <input class="p-2 border border-gray-300 rounded-lg w-full text-black" name="engineType" type="text" placeholder="Engine Type" th:value="${engineType}" />
        <div class="sm:col-span-2 flex justify-center">
          <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700">Search</button>
        </div>
      </form>
    </div>

    <div class="overflow-x-auto">
      <table class="min-w-max w-full border-collapse bg-gray-800 shadow-md rounded-3xl">
        <thead>
        <tr class="bg-gray-700 text-gray-100">
          <th class="p-3 text-left">Report ID</th>
          <th class="p-3 text-left">Report Date</th>
          <th class="p-3 text-left">Customer ID</th>
          <th class="p-3 text-left">Frame Number</th>
          <th class="p-3 text-left">Engine Type</th>
          <th class="p-3 text-left">Bench ID</th>
          <th class="p-3 text-left"></th>
        </tr>
        </thead>
        <tbody id="reports-table-content">
        <tr th:each="report : ${reports}" class="border-b">
          <td th:text="${report.id}" class="p-3"></td>
          <td th:text="${report.reportDate}" class="p-3"></td>
          <td th:text="${report.customer.id}" class="p-3"></td>
          <td th:text="${report.bike.frameNumber}" class="p-3"></td>
          <td th:text="${report.bike.bikeModel.engineType}" class="p-3"></td>
          <td th:text="${report.testBench.benchId}" class="p-3"></td>
          <td class="p-3">
            <a class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 w-full block text-center" th:href="@{/report/{id}(id=${report.id})}">Report</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

</body>
</html>
