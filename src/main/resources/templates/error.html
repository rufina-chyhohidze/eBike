<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<meta name="viewport" content="width=device-width, initial-scale=1">

<head>
    <meta charset="UTF-8">
    <title>Oops...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>
<nav th:replace="~{fragments/fragments :: navbar}"></nav>
<div class="wrap">
    <div class="error-symbol">
        <svg width="200" height="200" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" stroke="#ff005d" stroke-width="5" fill="none" />
            <line x1="50" y1="20" x2="50" y2="60" stroke="#ff005d" stroke-width="5" />
            <circle cx="50" cy="75" r="5" fill="#ff005d" />
        </svg>
    </div>

<div class="wrap">
    <h1 th:text="${errorCode}">404</h1>
    <h2 th:text="${errorMessage}">Page Not Found</h2>
    <p th:text="${errorDescription}">We encountered an error while processing your request. Please try again later.</p>

    <a href="/" class="home-button">Go Back Home</a>
</div>
</body>
</html>
