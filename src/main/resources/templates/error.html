<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

<div class="bg-white border border-gray-200 shadow-xl rounded-3xl p-10 max-w-lg text-center">
    <div class="flex justify-center mb-6">
        <i class="ph ph-warning-circle text-purple-600 text-6xl"></i>
    </div>
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Oops! Something went wrong.</h1>
    <p class="text-gray-600 mb-6">The page you are looking for might have been removed or is temporarily unavailable.</p>

    <a th:if="${#authorization.expression('hasRole(''WORKSHOPADMIN'')')}"
       th:href="@{/workshopadmin/dashboard}"
       class="inline-flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-all">
        <i class="ph ph-arrow-left"></i> Back to Dashboard
    </a>

    <a th:if="${#authorization.expression('hasRole(''TECHNICIAN'')')}"
       th:href="@{/technician/dashboard}"
       class="inline-flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-all">
        <i class="ph ph-arrow-left"></i> Back to Dashboard
    </a>

    <a th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}"
       th:href="@{/customer/dashboard}"
       class="inline-flex items-center gap-2 bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition-all">
        <i class="ph ph-arrow-left"></i> Back to Dashboard
    </a>
</div>

</body>
</html>
