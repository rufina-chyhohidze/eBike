<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bikes - eVALeBike</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/bike-management.js" type="module"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="/js/bikeSearch.js" type="module"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>
<body class="bg-gray-50 text-gray-800 flex min-h-screen">

<!-- SIDEBAR -->
<!-- System Admin Navbar -->
<div sec:authorize="hasRole('SUPERADMIN')" th:replace="fragments/superadmin-navbar :: superadmin-navbar"></div>

<!-- Workshop Admin Navbar -->
<div sec:authorize="hasRole('WORKSHOPADMIN')" th:replace="fragments/admin-navbar :: admin-navbar"></div>

<!-- Technician Navbar -->
<div sec:authorize="hasRole('TECHNICIAN')" th:replace="fragments/technicianNavbar :: navbar"></div>
<!-- Technician Navbar -->
<div sec:authorize="hasRole('CUSTOMER')" th:replace="fragments/customerNavbar :: navbar"></div>

<!-- MAIN CONTENT -->
<main class="flex-1 p-8 bg-white">
  <div class="max-w-5xl mx-auto bg-white p-10 rounded-3xl shadow-md border border-gray-200">
    <h2 class="text-3xl font-bold text-purple-600 mb-8 flex items-center gap-3">
      <i class="ph ph-bicycle text-2xl"></i> Bikes
    </h2>

    <div class="mb-6" sec:authorize="hasAnyRole('SUPERADMIN', 'WORKSHOPADMIN', 'TECHNICIAN')">
      <input
              id="bikeSearchInput"
              type="text"
              placeholder="Search by Frame Number..."
              class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
      />
    </div>


    <!-- Bike cards grid: only shown if user is authenticated as 'CUSTOMER' and bikes exist -->
    <div sec:authorize="hasRole('CUSTOMER')">
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" th:if="${#lists.size(bikes) > 0}">
        <div th:each="bike : ${bikes}" class="bike-card bg-gray-50 rounded-2xl shadow-sm border border-gray-200 p-6 hover:shadow-md transition">
          <h3 class="text-lg font-semibold text-purple-700 mb-2" th:text="${bike.bikeModel.brand}">Brand</h3>
          <p class="text-sm text-gray-600 mb-4" th:text="'Frame No: ' + ${bike.frameNumber}">Frame Number</p>

          <input type="hidden" name="_method" value="delete" />
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <a th:href="@{/report-list/{frame}(frame=${bike.frameNumber})}"
             class="mt-3 inline-flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl transition text-sm font-semibold shadow-md">
            <i class="ph ph-clipboard-text text-lg"></i> View Reports
          </a>

          <button class="unlink-bike-btn mt-3 inline-flex items-center gap-2 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-xl transition text-sm font-semibold shadow-md"
                  th:attr="data-frame=${bike.frameNumber}">
            <i class="ph ph-trash text-lg"></i> Delete Bike
          </button>
        </div>
      </div>
    </div>

    <!-- Bike cards grid (only if bikes exist) -->
    <div>
      <div id="bikeGrid" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        <!-- Bikes will be rendered here -->
      </div>
    </div>

  <div>
    <!-- Empty state (only if no bikes) -->
    <div sec:authorize="hasRole('CUSTOMER')">
      <div th:if="${#lists.size(bikes) == 0}" class="text-center py-16 text-gray-600 text-lg border border-dashed border-gray-300 rounded-xl">
        <i class="ph ph-warning-circle text-3xl text-purple-600 mb-4"></i>
        <p>Currently no bikes saved for this account.</p>
      </div>
    </div>

    <div id="noBikesMessage" class="hidden text-center py-16 text-gray-600 text-lg border border-dashed border-gray-300 rounded-xl">
      <i class="ph ph-warning-circle text-3xl text-purple-600 mb-4"></i>
      <p>Currently no bikes saved for this account.</p>
    </div>

  </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full">
      <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i class="fas fa-exclamation-triangle text-red-500"></i>
        Confirm Deletion
      </h2>
      <p class="text-gray-600 mb-6">Are you sure you want to remove this bike from your account?</p>
      <div class="flex justify-end gap-3">
        <button id="cancelBtn" class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
          Cancel
        </button>
        <button id="confirmBtn" class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition">
          Yes, Remove
        </button>
      </div>
    </div>
  </div>
</main>

</body>
</html>
