<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="adminnavbar">
  <aside class="bg-gray-900 text-white shadow-md p-4 sm:p-6 flex flex-col min-h-screen space-y-8 w-16 sm:w-64 transition-all duration-300">
    <div class="flex items-center justify-center sm:justify-start mb-6">
      <i class="ph ph-bicycle text-purple-500 text-3xl mr-0 sm:mr-2"></i>
      <h1 class="text-xl font-semibold hidden sm:inline">eVALeBike</h1>
    </div>

    <ul class="space-y-6 flex-1">
      <li class="flex items-center gap-3 text-gray-400 hover:text-purple-400 cursor-pointer">
        <a href="/workshopadmin/dashboard" class="flex items-center gap-3 w-full">
          <i class="ph ph-house text-xl"></i>
          <span class="hidden sm:inline">Dashboard</span>
        </a>
      </li>
      <li class="mt-auto">
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="bg-purple-600 text-white px-2 sm:px-4 py-2 rounded-lg w-full hover:bg-purple-700 flex items-center justify-center gap-2">
            <i class="ph ph-sign-out text-xl"></i>
            <span class="hidden sm:inline">Logout</span>
          </button>
        </form>
      </li>
    </ul>
  </aside>
</div>
</body>
</html>
