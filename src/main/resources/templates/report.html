<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Test Report</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module" src="/js/downloadPdf.js"></script>
</head>

<body class="container mt-4">
<div class="text-center mb-4">
  <button class="btn btn-primary" onclick="downloadPDF()">Download as PDF</button>
</div>
<div id="reportContent">
<h1 class="text-center mb-4">Test Report</h1>
<div class="mb-3">
  <p><strong>Chassis Number:</strong> <span th:text="${bike.getFrameNumber()}"></span></p>
</div>

<h2 class="mb-3">Average Values</h2>
<table class="table table-bordered table-striped">
  <thead class="table-dark">
  <tr>
    <th>Metric</th>
    <th>Average</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="entry : ${averages}">
    <td th:text="${entry.key}"></td>
    <td th:text="${#numbers.formatDecimal(entry.value, 1, 2)}"></td>
  </tr>
  </tbody>
</table>
</div>
<div class="text-center mt-4">
  <a th:href="@{/report/{id}/detailed(id=${id})}" class="btn btn-outline-secondary">View Detailed Report</a>
</div>

<div class="d-flex justify-content-center mt-4">
  <a href="/technician/dashboard" class="btn btn-primary">Back to dashboard</a>
</div>

</body>
</html>
