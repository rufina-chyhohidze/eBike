<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Test Report</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script>
    google.charts.load('current', {'packages':['corechart']});
    google.charts.setOnLoadCallback(() => drawChart("Battery Voltage (V)"));
  </script>
</head>
<body>
<h1>Test Report</h1>

<h2>Average Values</h2>
<table border="1">
  <tr>
    <th>Metric</th>
    <th>Average</th>
  </tr>
  <tr th:each="entry : ${averages}">
    <td th:text="${entry.key}"></td>
    <td th:text="${entry.value}"></td>
  </tr>
</table>

<h2>Metric Evolution</h2>
<label for="metricSelect">Select Metric:</label>
<select id="metricSelect" onchange="updateChart()">
  <option value="Battery Voltage (V)">Battery Voltage (V)</option>
  <option value="Battery Current (A)">Battery Current (A)</option>
  <option value="Battery Temperature (°C)">Battery Temperature (°C)</option>
  <option value="Engine Power (W)">Engine Power (W)</option>
  <option value="Wheel Power (W)">Wheel Power (W)</option>
  <option value="Bike Speed (km/h)">Bike Speed (km/h)</option>
</select>

<div id="metricChart" style="width: 900px; height: 500px;"></div>

<script src="/js/reportChart.js"></script>
</body>
</html>
