<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Test Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script type="module" src="/js/downloadPdf.js"></script>
</head>

<body class="bg-gray-50 h-full flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-gray-900 text-white shadow-md p-6 flex flex-col min-h-screen space-y-8">
  <div class="flex items-center mb-6">
    <i class="ph ph-bicycle text-purple-500 text-3xl mr-2"></i>
    <h1 class="text-2xl font-semibold">eVALeBike</h1>
  </div>
  <ul class="space-y-6 flex-1">
    <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
      <i class="ph ph-wrench"></i> <a href="/technician/dashboard">Dashboard</a>
    </li>
    <li class="flex items-center gap-3 text-purple-500 hover:text-white cursor-pointer">
      <i class="ph ph-clipboard-text"></i> Test Report
    </li>
    <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
      <i class="ph ph-chart-bar"></i> <a href="/technician/reports">Detailed Reports</a>
    </li>
    <li class="mt-auto">
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-lg w-full hover:bg-purple-700 flex items-center justify-center gap-2">
          <i class="ph ph-sign-out"></i> Logout
        </button>
      </form>
    </li>
  </ul>
</aside>

<!-- MAIN CONTENT -->
<main class="flex-1 p-8 bg-white overflow-y-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-semibold text-gray-800 flex items-center gap-2">
      <i class="ph ph-clipboard-text text-purple-500"></i> Test Report
    </h1>
    <button onclick="downloadPDF()" class="bg-purple-500 text-white px-5 py-2 rounded-lg hover:bg-purple-600 flex items-center gap-2">
      <i class="ph ph-download"></i> Download as PDF
    </button>
  </div>

  <div id="reportContent">
    <div class="bg-gray-100 rounded-3xl shadow-md p-6 border border-gray-200 mb-6">
      <p class="text-lg text-gray-700 mb-2">
        <strong>Chassis Number:</strong> <span th:text="${bike.getFrameNumber()}"></span>
      </p>
    </div>

    <div class="bg-white rounded-3xl shadow-md p-6 border border-gray-200 mb-6">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Average Values</h2>
      <table class="min-w-full text-sm text-left border border-gray-200 rounded-xl overflow-hidden">
        <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th class="px-4 py-3">Metric</th>
          <th class="px-4 py-3">Average</th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-100">
        <tr th:each="entry : ${averages}">
          <td class="px-4 py-3" th:text="${entry.key}"></td>
          <td class="px-4 py-3" th:text="${#numbers.formatDecimal(entry.value, 1, 2)}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row gap-4 mt-6">
    <a th:href="@{/report/{id}/detailed(id=${id})}" class="bg-gray-100 text-gray-800 px-5 py-3 rounded-lg hover:bg-gray-200 inline-flex items-center gap-2">
      <i class="ph ph-chart-bar"></i> View Detailed Report
    </a>
    <a href="/technician/dashboard" class="bg-purple-500 text-white px-5 py-3 rounded-lg hover:bg-purple-600 inline-flex items-center gap-2">
      <i class="ph ph-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</main>

</body>
</html>
