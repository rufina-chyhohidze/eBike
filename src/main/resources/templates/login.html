<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white shadow-lg rounded-2xl overflow-hidden flex flex-col-reverse md:flex-row w-full max-w-4xl">

    <!-- Login Form -->
    <div class="p-6 sm:p-8 md:w-1/2 flex flex-col justify-center">
        <h2 class="text-2xl sm:text-3xl font-bold text-center mb-6">Login</h2>

        <!-- Alert: Pending Approval -->
        <div th:if="${param.approval}" class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded mb-4 text-sm">
            Your account is pending approval by an administrator.
        </div>

        <!-- Alert: Invalid Credentials -->
        <div th:if="${param.credentials}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm">
            Invalid email or password. Please try again.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">

            <!-- Email Field -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
            </div>

            <!-- Password Field -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input type="checkbox" id="rememberMe" class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded" />
                <label for="rememberMe" class="ml-2 block text-sm text-gray-700">Remember me</label>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-lg transition">
                Login
            </button>

            <!-- Links -->
            <div class="text-center text-sm text-gray-600 mt-2">
                <a href="/forgot-password" class="hover:underline">Forgot password?</a> |
                <a href="/register" class="text-purple-600 hover:underline">Sign up</a>
            </div>
        </form>
    </div>

    <!-- Image -->
    <div class="md:w-1/2 w-full h-80 sm:h-96 md:h-auto flex items-center justify-center bg-gray-100">
        <img th:src="@{/img/bikee.png}" alt="Sample image" class="w-full h-full object-cover" />
    </div>

</div>

</body>
</html>
