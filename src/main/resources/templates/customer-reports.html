<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="../static/js/customer.js" th:src="@{/js/customer.js}" type="module"></script>
</head>
<body class="bg-gray-50 h-full flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-gray-900 text-white shadow-md p-6 flex flex-col min-h-screen space-y-8">
    <!-- LOGO -->
    <div class="flex items-center mb-6">
        <i class="ph ph-bicycle text-purple-500 text-3xl mr-2"></i>
        <h1 class="text-2xl font-semibold">eVALeBike</h1>
    </div>

    <ul class="space-y-6 flex-1">
        <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
            <i class="ph ph-house"></i><a href="/customer/dashboard">Dashboard</a>
        </li>
        <li class="flex items-center gap-3 text-purple-500 hover:text-white cursor-pointer">
            <i class="ph ph-clipboard-text"></i><a href="/customer/reports">My Reports</a>
        </li>
        <li class="mt-auto">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-lg w-full hover:bg-purple-700 flex items-center justify-center gap-2">
                    <i class="ph ph-sign-out"></i> Logout
                </button>
            </form>
        </li>
    </ul>
</aside>

<!-- REPORTS -->
<main class="flex-1 p-6 bg-white">
    <div class="mb-6">
        <h1 class="text-3xl font-semibold text-gray-800">My Bike Reports</h1>
        <p class="text-gray-600">View and search through all your bike test reports</p>
    </div>

    <!-- SEARCH FILTERS -->
    <div class="bg-white shadow-lg rounded-3xl p-6 mb-6 border border-gray-200">
        <h3 class="text-xl font-semibold mb-4 text-gray-800">Search Filters</h3>
        <div class="grid grid-cols-3 gap-4">
            <div>
                <label for="frameNumberSearch" class="block text-gray-700 mb-2">Frame Number</label>
                <input class="p-2 border border-gray-300 rounded-lg w-full" type="text" id="frameNumberSearch" placeholder="Enter frame number">
            </div>
            <div>
                <label for="bikeModelSearch" class="block text-gray-700 mb-2">Bike Model</label>
                <input class="p-2 border border-gray-300 rounded-lg w-full" type="text" id="bikeModelSearch" placeholder="Enter bike model">
            </div>
            <div>
                <label for="reportDateSearch" class="block text-gray-700 mb-2">Report Date</label>
                <input class="p-2 border border-gray-300 rounded-lg w-full" type="text" id="reportDateSearch" placeholder="YYYY-MM-DD">
            </div>
        </div>
    </div>

    <!-- REPORTS TABLE -->
    <div class="bg-gray-900 text-white shadow-lg rounded-3xl p-6 border border-gray-200">
        <h3 class="text-xl font-semibold mb-4 flex items-center gap-2 text-gray-200">
            <i class="ph ph-clipboard-text"></i> Bike Reports
        </h3>
        <table class="w-full border-collapse bg-gray-800 shadow-md rounded-3xl">
            <thead>
            <tr class="bg-gray-700 text-gray-100">
                <th class="p-3 text-left">Report ID</th>
                <th class="p-3 text-left">Report Date</th>
                <th class="p-3 text-left">Frame Number</th>
                <th class="p-3 text-left">Bench ID</th>
                <th class="p3 text-left"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="report : ${bikeReports}" class="border-b">
                <td th:text="${report.id}" class="p-3"></td>
                <td th:text="${report.reportDate}" class="p-3"></td>
                <td th:text="${report.bike.frameNumber}" class="p-3"></td>
                <td th:text="${report.testBench.benchId}" class="p-3"></td>
                <td class="p-3"><a class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 w-full" th:href="@{/report/{id}(id=${report.id})}">View Report</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
