<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bike Reports - eVALeBike</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>
<body class="bg-gray-50 text-gray-800 flex min-h-screen">

<!-- SIDEBAR -->
<div th:replace="fragments/customerNavbar"></div>

<!-- MAIN CONTENT -->
<main class="flex-1 p-8 bg-white">
    <div class="max-w-6xl mx-auto bg-white p-10 rounded-3xl shadow-md border border-gray-200">
        <h2 class="text-3xl font-bold text-purple-600 mb-6 flex items-center gap-3">
            <i class="ph ph-clipboard-text text-2xl"></i> Reports for Frame <span th:text="${frameNumber}" class="ml-2 font-mono text-lg text-gray-700"></span>
        </h2>

        <div th:if="${#lists.isEmpty(reports)}" class="text-center text-gray-600 py-20 border border-dashed border-gray-300 rounded-xl">
            <i class="ph ph-warning-circle text-3xl text-purple-600 mb-4"></i>
            <p>No reports found for this bike.</p>
        </div>

        <div th:if="${!(#lists.isEmpty(reports))}" class="bg-gray-900 text-white shadow-lg rounded-3xl p-6 border border-gray-200">
            <h3 class="text-xl font-semibold mb-4 flex items-center gap-2 text-gray-200">
                <i class="ph ph-clipboard-text"></i> Bike Reports
            </h3>
            <table class="w-full border-collapse bg-gray-800 shadow-md rounded-3xl">
                <thead>
                <tr class="bg-gray-700 text-gray-100">
                    <th class="p-3 text-left">Report ID</th>
                    <th class="p-3 text-left">Report Date</th>
                    <th class="p-3 text-left">Frame Number</th>
                    <th class="p-3 text-left">Bench ID</th>
                    <th class="p3 text-left"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reports}" class="border-b">
                    <td th:text="${report.id}" class="p-3"></td>
                    <td th:text="${report.reportDate}" class="p-3"></td>
                    <td th:text="${report.bike.frameNumber}" class="p-3"></td>
                    <td th:text="${report.testBench.benchId}" class="p-3"></td>
                    <td class="p-3"><a class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 w-full" th:href="@{/report/{id}(id=${report.id})}">View Report</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <!-- Back Button -->
        <div class="mb-6">
            <a href="/customer/bike-management" class="inline-flex items-center gap-2 bg-purple-100 text-purple-700 hover:bg-purple-200 px-4 py-2 rounded-lg text-sm font-medium transition">
                <i class="ph ph-arrow-left"></i> Back to My Bikes
            </a>
        </div>

    </div>
</main>

</body>
</html>
