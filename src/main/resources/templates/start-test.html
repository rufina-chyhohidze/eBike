<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Review Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    form {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #f9f9f9;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0, 0, 0, 0.1);
      border-top: 5px solid #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .message {
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }
  </style>
  <script type="module" th:src="@{/js/process-test.js}"></script>

</head>
<body>

<div id="loading" class="d-none">
  <div class="spinner"></div>
  <p class="message">Please don't close the page until the test is done</p>
</div>

<div id="test-form">
  <form>
    <label>Testbench Number</label>
    <input name="testbenchNumber" type="number" placeholder="001">

    <label>Test Type</label>
    <select th:name="testType">
      <option th:each="testType : ${testTypes}" th:value="${testType}" th:text="${testType}"></option>
    </select>

    <label>Email Bike Owner</label>
    <input name="emailBikeOwner" type="text" placeholder="hallo@email.com">

    <label>Chassis Number</label>
    <input name="chassisNumber" type="text" placeholder="VG2304K5111">

    <label>Bike Brand</label>
    <input name="bikeBrand" type="text" placeholder="Gazelle">

    <label>Bike Size</label>
    <select th:name="bikeSize">
      <option th:each="size : ${bikeSizes}" th:value="${size}" th:text="${size}"></option>
    </select>

    <label>Production Date</label>
    <input name="productionDate" type="number" placeholder="2022" >

    <label>Type</label>
    <input name="type" type="text" placeholder="Ultimate C380">

    <label>Powertrain</label>
    <input name="powertrain" type="text" value="Belt">

    <label>Engine Power - Max (W)</label>
    <input name="enginePowerMax" type="number" placeholder="600">

    <label>Mileage (km)</label>
    <input name="mileage" type="number" placeholder="850">

    <label>Accu Capacity (Wh)</label>
    <input name="accuCapacity" type="number" placeholder="500">

    <label>Engine Power - Nominal (W)</label>
    <input name="enginePowerNominal" type="number" placeholder="250">

    <label>Gear Type</label>
    <input name="gearType" type="text" placeholder="Enviolo">

    <label>Max Support (%)</label>
    <input name="maxSupport" type="number" placeholder="340">

    <label>Engine Torque (Nm)</label>
    <input name="engineTorque" type="number" placeholder="85">

    <label>Engine Type</label>
    <input name="engineType" type="text" placeholder="Bosch Performance Speed">

    <button type="submit">Submit</button>
  </form>
</div>
</body>
</html>
