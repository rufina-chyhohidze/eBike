<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Review Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/start-test.css}">
  <script type="module" th:src="@{/js/process-test.js}"></script>
</head>

<body>
<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

<div id="test-form">
  <h2>Bike Review Form</h2>
  <form>
    <div class="row g-3">
      <!-- Left Column -->
      <div class="col-md-4">
        <label>Testbench Number</label>
        <input name="testbenchNumber" type="number" class="form-control" placeholder="001">

        <label>Email Bike Owner</label>
        <input name="emailBikeOwner" type="text" class="form-control" placeholder="hallo@email.com">

        <label>Chassis Number</label>
        <input name="chassisNumber" type="text" class="form-control" placeholder="VG2304K5111">

        <label>Bike Brand</label>
        <input name="bikeBrand" type="text" class="form-control" placeholder="Gazelle">

        <label>Production Date</label>
        <input name="productionDate" type="number" class="form-control" placeholder="2022">

        <label>Max Support (%)</label>
        <input name="maxSupport" type="number" class="form-control" placeholder="340">
      </div>

      <div class="col-md-4">
        <label>Test Type</label>
        <select name="testType" class="form-control">
          <option th:each="testType : ${testTypes}" th:value="${testType}" th:text="${testType}"></option>
        </select>

        <label>Bike Size</label>
        <select name="bikeSize" class="form-control">
          <option th:each="size : ${bikeSizes}" th:value="${size}" th:text="${size}"></option>
        </select>

        <label>Type</label>
        <input name="type" type="text" class="form-control" placeholder="Ultimate C380">

        <label>Powertrain</label>
        <input name="powertrain" type="text" class="form-control" value="Belt">

        <label>Engine Power - Max (W)</label>
        <input name="enginePowerMax" type="number" class="form-control" placeholder="600">

        <label>Engine Torque (Nm)</label>
        <input name="engineTorque" type="number" class="form-control" placeholder="85">
      </div>

      <div class="col-md-4">
        <label>Mileage (km)</label>
        <input name="mileage" type="number" class="form-control" placeholder="850">

        <label>Accu Capacity (Wh)</label>
        <input name="accuCapacity" type="number" class="form-control" placeholder="500">

        <label>Engine Power - Nominal (W)</label>
        <input name="enginePowerNominal" type="number" class="form-control" placeholder="250">

        <label>Gear Type</label>
        <input name="gearType" type="text" class="form-control" placeholder="Enviolo">

        <label>Engine Type</label>
        <input name="engineType" type="text" class="form-control" placeholder="Bosch Performance Speed">
      </div>
    </div>

    <div class="mt-3 text-center">
      <button type="submit">Submit Test</button>
    </div>
  </form>
</div>

</body>
</html>
