    <div id="loading" class="d-none">
      <div class="spinner"></div>
      <p class="message">Please don't close the page until the test is done</p>
    </div>



     <main class="customer-search-container">

        <div class="search-customer-title-area" id="search-customer-title-area">
          <h1>Start a test</h1>
          <h4>Search for customer</h4>
          <cite>Enter an email of a registered customer to start a test</cite>
        </div>

          <div class="customer-email-area">
                <!-- <label>Enter customer Email</label> -->
                <div class="input-and-search">
                  <input id="emailBikeOwner" name="emailBikeOwner" type="text" placeholder="customer@gmail.com">
                  <button type="button" id="searchCustomer">Search</button>
                </div>
          </div>
          <div class="customer-found-test" id="customer-found-test">
            <!--   Here JS inserts the found customer  -->
               
          </div>

        <div id="customer-not-found" class="alert alert-danger" role="alert">
            Customer with email: <span id="customer-email-message"></span> not found.
        </div>

        <section class="container bike-container" id="bike-section">
          
          <div class="bikes-header">
            <button type="button">
              Add New Bike 
            </button>
            <h2 class="text-center mb-5" id="choose-bike-title">Choose a Bike</h2>
          </div>

          <div class="row row-cols-1 row-cols-md-3 g-4" id="bike-items-section">

            <!-- Here Bikes are inserted -->

          </div>
        </section>

        <div id="bikes-not-found" class="alert alert-danger" role="alert">
          This customer doesn't have any registered bikes.
      </div>

     </main>
