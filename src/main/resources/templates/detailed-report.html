<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detailed report view</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="/js/charts-detailed.js" type="module"></script>
</head>
<body class="container mt-4">
<h1 class="text-center mb-4">Detailed Report Visualization</h1>

<div class="text-center mb-4">
  <label for="compareId" class="form-label fw-bold">Compare With Report:</label>
  <select id="compareId" name="compareId" class="form-select">
    <!-- this blank option means “no comparison” -->
    <option value="">–– None ––</option>
    <option th:each="r : ${allReports}"
            th:value="${r.id}"
            th:text="${r.bike.frameNumber + ' – ' + r.reportDate}">
    </option>
  </select>
</div>


<div class="row mb-4">
  <div class="col-md-4">
    <label for="metricsSelect" class="form-label fw-bold">Select up to 4 Metrics:</label>
    <select id="metricsSelect" class="form-select" multiple>
      <option th:each="metric : ${metrics}"
              th:value="${metric.camelCaseName}"
              th:text="${metric.name}"
              th:data-metric="${metric.metric}">
      </option>
    </select>
  </div>


  <div class="col-md-4">
    <label for="modeSelect" class="form-label fw-bold">Value Type:</label>
    <select id="modeSelect" class="form-select">
      <option value="raw">Raw</option>
      <option value="normalized">Normalized</option>
    </select>
  </div>


  <div class="col-md-4">
    <label for="intervalSelect" class="form-label fw-bold">Time Interval:</label>
    <select id="intervalSelect" class="form-select">
      <option value="1">Per Second</option>
      <option value="10">Every 10 Seconds</option>
      <option value="60">Per Minute</option>
      <option value="300">Every 5 Minutes</option>
    </select>
  </div>
</div>

<div class="d-flex justify-content-center">
  <div id="detailedChart" style="width: 100%; height: 600px;" class="border shadow rounded bg-white p-3"></div>
</div>

<div class="text-center mt-4">
  <a th:href="@{/report/{id}(id=${id})}" class="btn btn-success">Back to report</a>
</div>

</body>
</html>
