<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detailed Report View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="/js/charts-detailed.js" type="module"></script>
  <script src="/js/report-comparison.js" type="module"></script>
  <script th:src="@{/js/reportFilter.js}" type="module"></script>
</head>
<body class="bg-gray-50 h-full flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-gray-900 text-white shadow-md p-6 flex flex-col min-h-screen space-y-8">
  <div class="flex items-center mb-6">
    <i class="ph ph-bicycle text-purple-500 text-3xl mr-2"></i>
    <h1 class="text-2xl font-semibold">eVALeBike</h1>
  </div>
  <ul class="space-y-6 flex-1">
    <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
      <i class="ph ph-wrench"></i> <a href="/technician/dashboard">Dashboard</a>
    </li>
    <li class="flex items-center gap-3 text-gray-400 hover:text-white cursor-pointer">
      <i class="ph ph-clipboard-text"></i> <a href="/technician/reports">Reports</a>
    </li>
    <li class="flex items-center gap-3 text-purple-500 hover:text-white cursor-pointer">
      <i class="ph ph-chart-bar"></i> Detailed Report
    </li>
    <li class="mt-auto">
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="bg-purple-600 text-white px-4 py-2 rounded-lg w-full hover:bg-purple-700 flex items-center justify-center gap-2">
          <i class="ph ph-sign-out"></i> Logout
        </button>
      </form>
    </li>
  </ul>
</aside>

<div id="report-selection" class="flex-1 hidden d-none p-8 bg-white overflow-y-auto">
  <div >
    <div class="bg-gray-900 text-white shadow-lg rounded-3xl p-6 col-span-4 border border-gray-200">
      <h3 class="text-xl font-semibold mb-4 flex justify-center items-center gap-2 text-center text-gray-200">
        <i class="ph ph-clipboard-text"></i> Previous Test Reports
      </h3>

      <!-- Centering the form -->
      <div class="flex justify-center">
        <form
                class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 w-full max-w-2xl">
          <input type="hidden" id="excludeCurrentReportId" checked>
          <input class="p-2 border border-gray-300 rounded-lg w-full text-black"
                 name="frameNumber"
                 type="text"
                 placeholder="Frame Number"
                 th:value="${frameNumber}">
          <input class="p-2 border border-gray-300 rounded-lg w-full text-black"
                 name="engineType"
                 type="text"
                 placeholder="Engine Type"
                 th:value="${engineType}">

          <div class="sm:col-span-2 flex justify-center">
            <button type="submit"
                    class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700">
              Search
            </button>
          </div>
        </form>
      </div>
      <table class="w-full border-collapse bg-gray-800 shadow-md rounded-3xl">
        <thead>
        <tr class="bg-gray-700 text-gray-100">
          <th class="p-3 text-left">Report ID</th>
          <th class="p-3 text-left">Report Date</th>
          <th class="p-3 text-left">Customer ID</th>
          <th class="p-3 text-left">Frame Number</th>
          <th class="p-3 text-left">Engine Type</th>
          <!--                <th class="p-3 text-left">Brand</th>-->
          <th class="p-3 text-left">Bench ID</th>
          <th class="p3 text-left"></th>
        </tr>
        </thead>
        <tbody id="reports-table-content">
        <tr th:each="report : ${reports}" class="border-b">
          <td th:text="${report.id}" class="p-3"></td>
          <td th:text="${report.reportDate}" class="p-3"></td>
          <td th:text="${report.customer.id}" class="p-3"></td>
          <td th:text="${report.bike.frameNumber}" class="p-3"></td>
          <td th:text="${report.bike.bikeModel.engineType}" class="p-3"></td>
          <!--                <td th:text="${report.bike.brand}" class="p-3"></td>-->
          <td th:text="${report.testBench.benchId}" class="p-3"></td>
          <!--          <td class="p-3"><a class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 w-full" th:href="@{/report/{id}(id=${report.id})}">Report</a></td>-->
          <td><button class="bg-purple-500 text-white px-4 py-2 rounded-lg hover:bg-purple-600 w-full">Select</button></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
<!-- MAIN CONTENT -->
<main id="main-content" class="flex-1 p-8 bg-white overflow-y-auto">
  <h1 class="text-3xl font-semibold text-gray-800 mb-6 flex items-center gap-2">
    <i class="ph ph-chart-line-up text-purple-500"></i> Detailed Report Visualization
  </h1>

  <!-- Report Selection -->

  <div class="text-center mb-4 flex flex-col items-center">
    <label class="form-label fw-bold">Select report for comparison</label>
    <div class="flex flex-row gap-4">
      <button id="compareButton" class="rounded-xl py-2 px-4 bg-purple-600 text-white mt-3">Select Report</button>
      <button id="removeSelectedReport" class="rounded-xl disabled:border-gray-400 disabled:text-gray-500 py-2 px-4 border-2 border-purple-500 text-purple-500 mt-3" disabled>Remove selected</button>
    </div>
    <!--    <select id="compareId" name="compareId" class="form-select">-->
    <!--      <option value="">–– None ––</option>-->
    <!--      <option th:each="r : ${allReports}"-->
    <!--              th:value="${r.id}"-->
    <!--              th:text="${r.bike.frameNumber + ' – ' + r.reportDate}">-->
    <!--      </option>-->
    <!--    </select>-->
    <!--    <button id="compareButton" class="btn btn-primary mt-3" disabled>Compare</button>-->
  </div>

  <div class="hidden bg-gray-100 border border-gray-200 rounded-2xl p-6 mb-6 shadow-sm">
    <label for="compareId" class="block text-gray-700 font-medium mb-2">Compare with Report:</label>
    <select id="compareId" name="compareId" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
      <option value="">–– None ––</option>
      <option th:each="r : ${allReports}"
              th:value="${r.id}"
              th:text="${r.bike.frameNumber + ' – ' + r.reportDate}">
      </option>
    </select>
  </div>

  <!-- Filter Options -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    <div>
      <label for="metricsSelect" class="block text-gray-700 font-medium mb-2">Select up to 4 Metrics:</label>
      <select id="metricsSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500" multiple>
        <option th:each="metric : ${metrics}"
                th:value="${metric.camelCaseName}"
                th:text="${metric.name}">
        </option>
      </select>
    </div>
    <div>
      <label for="modeSelect" class="block text-gray-700 font-medium mb-2">Value Type:</label>
      <select id="modeSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
        <option value="raw">Raw</option>
        <option value="normalized">Normalized</option>
      </select>
    </div>
    <div>
      <label for="intervalSelect" class="block text-gray-700 font-medium mb-2">Time Interval:</label>
      <select id="intervalSelect" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-purple-500 focus:border-purple-500">
        <option value="1">Per Second</option>
        <option value="10">Every 10 Seconds</option>
        <option value="60">Per Minute</option>
        <option value="300">Every 5 Minutes</option>
      </select>
    </div>
  </div>

  <!-- Chart -->
  <div class="bg-white rounded-3xl shadow-xl p-6 border border-gray-200 transition-all duration-500 ease-in-out hover:shadow-2xl">
    <div id="detailedChart" class="transition-transform duration-300 ease-in-out hover:scale-[1.01]" style="width: 100%; height: 600px;"></div>
  </div>

  <!-- Back Button -->
  <div class="mt-6">
    <a th:href="@{/report/{id}(id=${id})}" class="bg-purple-500 text-white px-5 py-3 rounded-lg hover:bg-purple-600 inline-flex items-center gap-2">
      <i class="ph ph-arrow-left"></i> Back to Report
    </a>
  </div>
</main>
</body>
</html>
