<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikes Registered</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="../static/js/technician.js" th:src="@{/js/technician.js}" type="module"></script>
  <script th:src="@{/js/customerFilter.js}" type="module"></script>
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body class="bg-gray-50 min-h-screen flex flex-row">

<!-- SIDEBAR -->
<div th:replace="~{fragments/technicianNavbar}"></div>

<!-- MAIN CONTENT -->
<main class="flex-1 p-6 bg-white overflow-y-auto">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-3xl shadow-lg border border-gray-200">

    <!-- Header -->
    <h2 class="text-2xl font-semibold text-gray-800 mb-6 flex flex-wrap items-center gap-2 break-words">
      <i class="ph ph-bicycle text-2xl text-purple-600"></i>
      <span class="text-gray-800">Bikes Registered by
        <span th:text="${technician.name}" class="text-purple-600 ml-1 break-words inline-block max-w-full"></span>
      's Customers</span>
    </h2>

    <!-- Search -->
    <form method="get" th:action="@{/technician/bikes}" class="mb-6">
      <input type="text" name="search" placeholder="Search bikes..."
             th:value="${search}"
             class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
    </form>

    <!-- Table -->
    <div class="overflow-x-auto rounded-lg">
      <table class="min-w-full table-auto text-sm bg-white">
        <thead class="bg-gray-100 text-gray-700">
        <tr>
          <th class="p-3 text-left whitespace-nowrap">Frame Number</th>
          <th class="p-3 text-left whitespace-nowrap">Type</th>
          <th class="p-3 text-left whitespace-nowrap">Brand</th>
          <th class="p-3 text-left whitespace-nowrap">Customer</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="bike : ${bikes}" class="border-b">
          <td th:text="${bike.frameNumber}" class="p-3"></td>
          <td th:text="${bike.bikeModel.type}" class="p-3"></td>
          <td th:text="${bike.bikeModel.brand}" class="p-3"></td>
          <td th:text="${bike.bikeOwner.name}" class="p-3"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(bikes)}">
          <td colspan="4" class="text-center text-gray-500 p-4">No matching bikes found.</td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- Back Button -->
    <div class="mt-6 flex justify-end">
      <a href="/technician/dashboard"
         class="bg-purple-600 text-white px-5 py-2 rounded-lg hover:bg-purple-700 inline-flex items-center gap-2">
        <i class="ph ph-arrow-left"></i> Back to Dashboard
      </a>
    </div>
  </div>
</main>

</body>
</html>
