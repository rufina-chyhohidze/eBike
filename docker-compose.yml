services:
    nginx:
        image: nginx:latest
        container_name: nginx-reverse-proxy
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./azure-config/nginx/templates:/etc/nginx/templates
            - ./azure-config/nginx/letsencrypt:/etc/letsencrypt
#        environment:
#            - ANIR_DNS=${SERV_ADDRESS}
#        networks:
#            - anir-backend-container-communication-network
        depends_on:
            team18-int4-java-app:
                condition: service_started


    team18-int4-java-app:
        build: .
        container_name: team18-int4-java-app
        ports:
            -   "8080:8080"


#        environment:
#            PROFILE: 'prod'
#            DB_URL: 'jdbc:postgresql://postgres_ebike_db:5432/ebike'
#        networks:
##            - team18-network
