version: '3.8'

services:
    postgres_ebike_db:
        image: postgres:17.2-alpine
        restart: always
        environment:
            POSTGRES_DB: 'ebike'
            POSTGRES_USER: 'dev'
            POSTGRES_PASSWORD: 'bike'
        ports:
            - '5055:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
volumes:
    db-data:
