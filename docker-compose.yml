services:
    team18-integration-javaapp:
        build: .
        container_name: team18-int4-javaapp
        ports:
            -   "80:80"
#        environment:
#            PROFILE: 'prod'
#            DB_URL: 'jdbc:postgresql://postgres_ebike_db:5432/ebike'
#        networks:
##            - team18-network
#        depends_on:
#            -   postgres_ebike_db

    postgres_ebike_db:
        image: postgres:17.2-alpine
        container_name: team18-prod-db
        restart: always
        environment:
            POSTGRES_DB: 'ebike'
            POSTGRES_USER: 'dev'
            POSTGRES_PASSWORD: 'bike'
        ports:
            - '5055:5432'
        volumes:
            - ebike-db:/var/lib/postgresql/data

    team18-integration-test:
        image: gradle:jdk17
        container_name: team18-int4-test
        working_dir: /team18-project
        volumes:
            -   "./:/team18-project"
#        environment:
#            PROFILE: 'prod'
#            DB_URL: 'jdbc:postgresql://postgres_ebike_db:5432/ebike'
#        command: ./gradlew check
        command: ./gradlew --no-daemon -p /team18-project check
        depends_on:
            - postgres_ebike_test_db

    postgres_ebike_test_db:
        image: postgres:17.2-alpine
        container_name: team18-test-db
        restart: always
        environment:
            POSTGRES_DB: 'ebike_test'
            POSTGRES_USER: 'dev'
            POSTGRES_PASSWORD: 'bike'
        ports:
            - '5065:5432'

volumes:
    ebike-db:

