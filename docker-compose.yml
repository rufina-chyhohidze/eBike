services:
    nginx:
        image: nginx:latest
        container_name: nginx-reverse-proxy
        ports:
            - "80:80"
            - "443:443"
        environment:
            - SUB_DOMAIN=${SUB_DOMAIN}
        volumes:
            - ./azure-config/nginx/templates:/etc/nginx/templates
            - ./azure-config/nginx/letsencrypt:/etc/letsencrypt
#        environment:
#            - ANIR_DNS=${SERV_ADDRESS}
        networks:
            - team18-network
        depends_on:
            team18-int4-java-app:
                condition: service_started


    team18-int4-java-app:
        build: .
        container_name: team18-int4-java-app
        networks:
            - team18-network


#        environment:
#            PROFILE: 'prod'
#            DB_URL: 'jdbc:postgresql://postgres_ebike_db:5432/ebike'

#        depends_on:
#            -   postgres_ebike_db

    postgres_ebike_db:
        image: postgres:17.2-alpine
        container_name: team18-prod-db
        restart: always
        environment:
            POSTGRES_DB: 'ebike'
            POSTGRES_USER: 'dev'
            POSTGRES_PASSWORD: 'bike'
        ports:
            - '5055:5432'
        volumes:
            - ebike-db:/var/lib/postgresql/data

    team18-integration4-test:
        image: timbru31/java-node:21-alpine-jdk-22
        container_name: team18-integration4-test
        working_dir: /team18-project/
        volumes:
            -   "./:/team18-project/"
        command: ./gradlew check
        depends_on:
            - postgres_ebike_test_db
        networks:
            - ebike-test-network

    postgres_ebike_test_db:
        image: postgres:17.2-alpine
        container_name: postgres_ebike_test_db
        environment:
            POSTGRES_DB: 'ebike_test'
            POSTGRES_USER: 'dev'
            POSTGRES_PASSWORD: 'bike'
        ports:
            - '5065:5432'
        volumes:
            - ebike-test-db:/var/lib/postgresql/data
        networks:
            - ebike-test-network

networks:
    ebike-test-network:
        driver: bridge
    team18-network:
        driver: bridge


volumes:
    ebike-db:
    ebike-test-db:

