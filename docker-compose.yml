    team18-integration-test:
        image: gradle:jdk17
        container_name: team18-int4-test
        working_dir: /team18-project
        volumes:
            -   "./:/team18-project"
#        environment:
#            PROFILE: 'prod'
#            DB_URL: 'jdbc:postgresql://postgres_ebike_db:5432/ebike'
        command: ./gradlew check
        depends_on:
            - postgres_ebike_test_db
        networks:
            - ebike-test-network

    postgres_ebike_test_db:
        image: postgres:17.2-alpine
        container_name: team18-test-db
        restart: always
        environment:
            POSTGRES_DB: 'ebike_test'
            POSTGRES_USER: 'dev'
            POSTGRES_PASSWORD: 'bike'
        ports:
            - '5065:5432'
        volumes:
            - ebike-test-db:/var/lib/postgresql/data
        networks:
            - ebike-test-network

networks:
    ebike-test-network:
        driver: bridge

volumes:
    ebike-db:
    ebike-test-db:

